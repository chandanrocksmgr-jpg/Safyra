crons:
  - name: checkout-recovery
    description: "Marks inactive checkouts abandoned and sends each permitted recovery email once"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/checkout-recovery"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: order-emails
    description: "Delivers queued order-request and verified-payment transactional emails once"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/order-emails"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: payu-reconcile
    description: "Reconciles pending PayU payments and safely expires unfinished payment sessions"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/payu-reconcile"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true